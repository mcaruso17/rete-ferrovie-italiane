# Pubblica la piattaforma su GitHub Pages.
#
# Da attivare una volta sola: Settings -> Pages -> Source: "GitHub Actions".
# Non si puo' automatizzare: il token di Actions non ha il permesso di creare il
# sito Pages, quindi configure-pages con "enablement" fallisce con
# "Resource not accessible by integration" finche' Pages non e' attivo.
# Con repository privata servirebbe un piano GitHub Pro o Team; con repository
# pubblica funziona sul piano gratuito.
name: Pubblica la piattaforma

on:
  push:
    branches: [main]
    paths:
      - 'piattaforma/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito
        run: |
          mkdir -p sito/data
          # la piattaforma e' scritta come frammento (l'Artifact aggiunge lui
          # l'intestazione del documento): qui va completata a mano
          python3 tools/wrap_site.py piattaforma/index.html sito/index.html
          cp data/*.csv data/*.geojson data/cdp-rfi-dataset.json data/piano-commerciale-2026.json data/validazione.txt \
            data/validazione-servizi.txt data/catalogo.json data/LEGGIMI.txt sito/data/
          # i PDF di partenza, cosi' ogni numero resta verificabile alla fonte
          cp *.pdf sito/data/ 2>/dev/null || true
          touch sito/.nojekyll
          ls -la sito sito/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
